<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #game { width: 100%; height: 100%; }
      .rm-toast {
        position: fixed; top: 12px; left: 50%; z-index: 9999;
        display: flex; align-items: center; gap: 12px;
        max-width: calc(100% - 32px); padding: 10px 16px 10px 10px;
        background: #1d1d1d; color: #fff; border: 2px solid #7c5cff; border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        font-family: 'VT323', ui-monospace, monospace;
        transform: translate(-50%, -140%); transition: transform 0.35s ease;
        pointer-events: none;
      }
      .rm-toast-in { transform: translate(-50%, 0); }
      .rm-toast-badge {
        flex: none; display: grid; place-items: center; width: 44px; height: 44px;
        background: #7c5cff; border-radius: 8px; font-size: 28px; line-height: 1;
      }
      .rm-toast-label { font-size: 15px; letter-spacing: 1.5px; color: #b9a8ff; }
      .rm-toast-title { font-size: 24px; line-height: 1.1; }
      .rm-toast-desc { font-size: 17px; color: #d4d4d4; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game"></div>
    <script>
      // TODO(before launch): self-host EmulatorJS data on R2 and pin a version.
      const EJS_CDN = 'https://cdn.emulatorjs.org/stable/data/'
      const params = new URLSearchParams(location.search)
      const url = params.get('url') || ''
      // Only same-origin game URLs: bundled files, or blob: URLs created by the parent page.
      const allowed = url.startsWith('/') && !url.startsWith('//') || url.startsWith('blob:' + location.origin + '/')
      if (!allowed) {
        document.body.textContent = 'Invalid game URL.'
        document.body.style.color = '#fff'
      } else {
        window.EJS_player = '#game'
        window.EJS_core = params.get('core')
        window.EJS_gameUrl = url
        window.EJS_gameName = params.get('name') || 'game'
        window.EJS_pathtodata = EJS_CDN
        window.EJS_color = '#7c5cff'
        window.EJS_startOnLoaded = true
        window.EJS_onGameStart = () => {
          setTimeout(applySettings, 0)
          startAchievements()
          if (params.get('cloud') === '1') useCloudSaves()
          parent.postMessage({ type: 'revivemode:started' }, location.origin)
        }
        const s = document.createElement('script')
        s.src = EJS_CDN + 'loader.js'
        document.body.appendChild(s)
      }

      // ---------------------------------------------------------------
      // Player settings saved by the site (lib/settingsStore.ts). Same
      // origin, so this page reads them straight from localStorage and
      // picks up changes live through the storage event.
      const SETTINGS_KEY = 'revivemode.settings.v1'
      const DEFAULTS = {
        pauseOnBlur: true,
        controllerSupport: true,
        vsync: true,
        smoothing: false,
        aspect: 'Original',
        controls: { up: 'up', down: 'down', left: 'left', right: 'right', A: 'X', B: 'Z', SELECT: 'SHIFT', START: 'ENTER' },
      }
      function readSettings() {
        try {
          const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')
          return { ...DEFAULTS, ...s, controls: { ...DEFAULTS.controls, ...s.controls } }
        } catch {
          return DEFAULTS
        }
      }

      // Site button -> EmulatorJS (RetroArch) button index.
      const BUTTON_INDEX = { B: 0, SELECT: 2, START: 3, up: 4, down: 5, left: 6, right: 7, A: 8 }
      const NAMED = {
        up: 38, down: 40, left: 37, right: 39, SPACE: 32, ENTER: 13, SHIFT: 16, CONTROL: 17, ALT: 18, TAB: 9, BACKSPACE: 8,
        CAPSLOCK: 20, INSERT: 45, DELETE: 46, HOME: 36, END: 35, PAGEUP: 33, PAGEDOWN: 34,
        ',': 188, '.': 190, '/': 191, ';': 186, '=': 187, '-': 189, '[': 219, ']': 221, '\\': 220, "'": 222, '`': 192,
      }
      // Key label from the Controls table (e.g. "X", "up", "ENTER", "F2") -> keyCode.
      function keyCode(label) {
        if (label in NAMED) return NAMED[label]
        if (/^[A-Z0-9]$/.test(label)) return label.charCodeAt(0)
        const f = /^F([1-9]|1[0-2])$/.exec(label)
        return f ? 111 + Number(f[1]) : null
      }

      let pausedByUs = false
      let gamepadHandler = null

      function applySettings() {
        const emu = window.EJS_emulator
        if (!emu || !emu.started) return
        const s = readSettings()

        // Keyboard map for player 1. Clear the key from any other button so
        // one press doesn't trigger two buttons.
        const p1 = emu.controls[0] || (emu.controls[0] = {})
        // EmulatorJS stores key codes, or key names (its keyMap) in its defaults.
        const byName = Object.fromEntries(Object.entries(emu.keyMap || {}).map(([code, name]) => [name, Number(code)]))
        const codeOf = (v) => (typeof v === 'number' ? v : byName[v] ?? null)
        const assigned = {}
        for (const [btn, idx] of Object.entries(BUTTON_INDEX)) {
          const code = keyCode(s.controls[btn])
          if (code != null) assigned[idx] = code
        }
        const used = new Set(Object.values(assigned))
        for (const i of Object.keys(p1)) {
          if (!(i in assigned) && p1[i] && used.has(codeOf(p1[i].value))) p1[i].value = ''
        }
        for (const [idx, code] of Object.entries(assigned)) {
          p1[idx] = { ...(p1[idx] || {}), value: code }
        }

        // Gamepads on or off.
        if (!gamepadHandler) gamepadHandler = emu.gamepadEvent
        emu.gamepadEvent = s.controllerSupport ? gamepadHandler : () => {}

        try {
          emu.gameManager.setVSync(s.vsync ? 1 : 0)
        } catch {
          /* core without VSync control */
        }

        const style = document.getElementById('rm-video') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'rm-video' }))
        style.textContent =
          (s.smoothing ? '' : '#game canvas { image-rendering: pixelated; }') +
          (s.aspect === 'Stretch' ? '#game canvas { width: 100% !important; height: 100% !important; }' : '')

        if (!s.pauseOnBlur && pausedByUs) {
          pausedByUs = false
          emu.play()
        }
      }

      window.addEventListener('storage', (e) => {
        if (e.key === SETTINGS_KEY) applySettings()
      })

      // ---------------------------------------------------------------
      // Achievements. A set lives in /achievements/<game>.json and only runs
      // for the exact hosted file it was written for (a user's own ROM may be
      // a different version with different addresses). Game memory is read
      // from the EmulatorJS save-state snapshot: `snapshot.wramStart` is where
      // Game Boy address C000 sits in that snapshot for this core and game.
      // Unlocks are saved in localStorage (revivemode.achievements.v1) and
      // posted to the parent page.
      const ACH_KEY = 'revivemode.achievements.v1'
      const ACH_POLL_MS = 250

      function readUnlocks() {
        try {
          return JSON.parse(localStorage.getItem(ACH_KEY) || '{}')
        } catch {
          return {}
        }
      }

      function readValue(state, start, trigger) {
        const off = start + (parseInt(trigger.address, 16) - 0xc000)
        if (trigger.format === 'bcd5le') {
          // µCity money: 5 bytes, two decimal digits per byte, lowest byte first.
          let v = 0
          for (let i = 4; i >= 0; i--) {
            const b = state[off + i]
            v = v * 100 + (b >> 4) * 10 + (b & 15)
          }
          return v
        }
        return state[off] // u8
      }

      function compare(v, op, target) {
        switch (op) {
          case '>=': return v >= target
          case '>': return v > target
          case '==': return v === target
          case '<=': return v <= target
          case '<': return v < target
          default: return false
        }
      }

      async function startAchievements() {
        const gameId = params.get('game')
        if (!gameId || !/^[a-z0-9-]+$/.test(gameId)) return
        let set
        try {
          const res = await fetch(`/achievements/${gameId}.json`)
          if (!res.ok) return
          set = await res.json()
        } catch {
          return
        }
        const emu = window.EJS_emulator
        const gm = emu && emu.gameManager
        if (!gm || set.file !== url || emu.getCore() !== set.core) return

        // If the core's snapshot layout ever changes (e.g. a new EmulatorJS
        // version), our offsets would point at the wrong bytes: switch off
        // rather than unlock things by accident.
        const first = gm.getState()
        if (!first || first.length !== set.snapshot.bytes) {
          console.warn('[achievements] snapshot layout changed; achievements off for', gameId)
          return
        }

        const unlocked = readUnlocks()[gameId] || {}
        // An achievement only fires after its condition has been false at
        // least once this session, so boot-time memory or loading a save that
        // already meets it doesn't hand it out instantly.
        const pending = set.achievements
          .filter((a) => !unlocked[a.id])
          .map((a) => ({ ...a, armed: false }))
        if (!pending.length) return

        const timer = setInterval(() => {
          if (emu.paused) return
          const state = gm.getState()
          for (const a of pending) {
            if (a.done) continue
            const met = compare(readValue(state, set.snapshot.wramStart, a.trigger), a.trigger.op, a.trigger.value)
            if (!met) a.armed = true
            else if (a.armed) {
              a.done = true
              unlock(gameId, a)
            }
          }
          if (pending.every((a) => a.done)) clearInterval(timer)
        }, ACH_POLL_MS)
      }

      function unlock(gameId, a) {
        const all = readUnlocks()
        all[gameId] = { ...(all[gameId] || {}), [a.id]: new Date().toISOString() }
        try {
          localStorage.setItem(ACH_KEY, JSON.stringify(all))
        } catch {
          /* storage blocked: still show the pop-up */
        }
        parent.postMessage({ type: 'revivemode:achievement', gameId, id: a.id }, location.origin)
        showToast(a)
      }

      function showToast(a) {
        const el = document.createElement('div')
        el.className = 'rm-toast'
        el.setAttribute('role', 'status')
        el.innerHTML = '<div class="rm-toast-badge">★</div><div><div class="rm-toast-label">ACHIEVEMENT UNLOCKED</div><div class="rm-toast-title"></div><div class="rm-toast-desc"></div></div>'
        el.querySelector('.rm-toast-title').textContent = `${a.title} · ${a.points} pts`
        el.querySelector('.rm-toast-desc').textContent = a.description
        document.body.appendChild(el)
        requestAnimationFrame(() => el.classList.add('rm-toast-in'))
        setTimeout(() => {
          el.classList.remove('rm-toast-in')
          setTimeout(() => el.remove(), 400)
        }, 5000)
      }

      // ---------------------------------------------------------------
      // With ?cloud=1 (signed in), the emulator's own Save State / Load State
      // buttons go to the account's cloud slot instead of this browser: the
      // site does the upload/download and answers with a short notice.
      function useCloudSaves() {
        const emu = window.EJS_emulator
        emu.on('saveState', ({ state }) => {
          const copy = new Uint8Array(state)
          parent.postMessage({ type: 'revivemode:cloudSave', state: copy }, location.origin, [copy.buffer])
        })
        emu.on('loadState', () => parent.postMessage({ type: 'revivemode:cloudLoad' }, location.origin))
      }

      function showNotice(text, error) {
        const el = document.createElement('div')
        el.className = 'rm-toast'
        el.setAttribute('role', 'status')
        el.style.borderColor = error ? '#e53201' : '#74e7b7'
        el.innerHTML = '<div class="rm-toast-desc" style="padding-left:6px;color:#fff"></div>'
        el.firstChild.textContent = text
        document.body.appendChild(el)
        requestAnimationFrame(() => el.classList.add('rm-toast-in'))
        setTimeout(() => {
          el.classList.remove('rm-toast-in')
          setTimeout(() => el.remove(), 400)
        }, 2500)
      }

      // ---------------------------------------------------------------
      // Cloud saves (lib/cloudSaves.ts). The site asks for the current
      // save state or hands one back to load; same origin only.
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || e.source !== parent) return
        const { type, id, state } = e.data || {}
        if (type === 'revivemode:notice') return showNotice(String(e.data.text || ''), !!e.data.error)
        if (type !== 'revivemode:getState' && type !== 'revivemode:loadState') return
        const reply = (data) => parent.postMessage({ id, ...data }, location.origin)
        const emu = window.EJS_emulator
        const gm = emu && emu.gameManager
        if (!gm || !emu.started) return reply({ error: 'Start the game first.' })
        if (gm.supportsStates && !gm.supportsStates()) return reply({ error: 'This system does not support save states.' })
        try {
          if (type === 'revivemode:getState') {
            const s = gm.getState()
            const copy = new Uint8Array(s) // the core reuses its buffer
            parent.postMessage({ id, state: copy }, location.origin, [copy.buffer])
          } else {
            if (!(state instanceof Uint8Array)) return reply({ error: 'Bad save file.' })
            // States for one core and game are a fixed size; a different size
            // means another game, another ROM version or a broken file, which
            // the core would silently ignore.
            if (state.length !== gm.getState().length) return reply({ error: "That save doesn't match this game or ROM version." })
            gm.loadState(state)
            reply({ ok: true })
          }
        } catch (err) {
          reply({ error: 'The emulator could not ' + (type === 'revivemode:getState' ? 'save' : 'load') + ' that state.' })
        }
      })

      document.addEventListener('visibilitychange', () => {
        const emu = window.EJS_emulator
        if (!emu || !emu.started) return
        if (document.hidden) {
          if (readSettings().pauseOnBlur && !emu.paused) {
            emu.pause()
            pausedByUs = true
          }
        } else if (pausedByUs) {
          pausedByUs = false
          emu.play()
        }
      })
    </script>
  </body>
</html>
